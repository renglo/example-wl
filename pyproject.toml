[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "example-wl"
version = "0.0.2rc1"
description = "Template logos, captions, locales, and product package list."
license = { text = "MIT" }
requires-python = ">=3.12"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wl = ["locales/*.json", "assets/*", "product.yaml"]

[tool.renglo]
platform = "0.1.4"
